# =====================================================================
# App Estudo + Treino — configuração do Supabase CLI
# Referência: https://supabase.com/docs/guides/local-development/cli/config
# =====================================================================
project_id = "aplicativo-academia"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# auto_expose_new_tables NÃO é setado de propósito.
# Desde 2026-04-28 tabelas novas em `public` não são expostas à Data API
# automaticamente. Todo GRANT é explícito — ver migration 10_rls.sql.

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false
# Não usamos Realtime na v1. O feed é painel consultado, não stream.

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.avatares]
public = false
file_size_limit = "2MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
# Domínio de produção. Este valor é o destino padrão de TODO link de e-mail
# quando a URL pedida pelo cliente não está na lista abaixo — foi por isso
# que confirmar conta parou de funcionar ao trocar para megs.digital: o
# link continuava apontando para o endereço antigo.
#
# ATENÇÃO: este arquivo configura o stack LOCAL. O projeto na nuvem tem a
# própria configuração, no painel (Authentication → URL Configuration), e
# ela NÃO muda com `db push`. Só `supabase config push` sincroniza as duas.
site_url = "https://www.megs.digital"
additional_redirect_urls = [
  "https://www.megs.digital/auth/callback",
  "https://megs.digital/auth/callback",
  "http://127.0.0.1:5173/auth/callback",
  "http://localhost:5173/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# App pessoal, fechado por convite. Anônimo desligado de propósito:
# `TO authenticated` não distingue anônimo de logado de verdade.
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# ---------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------
# As três de IA exigem usuário logado: verify_jwt = true.
[functions.montar-treino]
enabled = true
verify_jwt = true

[functions.montar-estudo]
enabled = true
verify_jwt = true

[functions.extrair-topicos]
enabled = true
verify_jwt = true

# Chamada pelo pg_cron via pg_net, não por usuário. Autentica por
# header `x-cron-secret` (ver 13_cron.sql), então não exige JWT.
[functions.disparar-notificacoes]
enabled = true
verify_jwt = false

# Testa o provedor de IA configurado antes de depender dele. Exige login:
# gasta token de verdade, então não pode ficar aberta.
[functions.diagnostico-ia]
enabled = true
verify_jwt = true

[analytics]
enabled = false
