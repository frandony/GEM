<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover libera as safe-area-inset. Sem isso a barra
         inferior fica atrás do indicador de home do iPhone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0c10" />
    <!-- Standalone no iOS. Sem isto, "Adicionar à Tela de Início" abre no
         Safari com barra — e sem PWA instalada não há push nenhum. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Treino" />
    <link rel="apple-touch-icon" href="/icones/192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icones/favicon.png" />

    <title>Estudo + Treino</title>
    <meta
      name="description"
      content="Treino de academia e blocos de estudo no mesmo lugar: plano montado por IA, progressão de carga automática e streak em grupo."
    />
    <!-- App fechado, de uso pessoal: não queremos indexação em buscador.
         As tags Open Graph ficam mesmo assim — elas servem para o link
         mandado no WhatsApp para quem entra no grupo, e isso é privado. -->
    <meta name="robots" content="noindex, nofollow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Estudo + Treino" />
    <meta property="og:title" content="Estudo + Treino" />
    <meta
      property="og:description"
      content="Treino e estudo no mesmo lugar, com streak em grupo."
    />
    <meta property="og:image" content="https://www.megs.digital/icones/512.png" />
    <meta property="og:url" content="https://www.megs.digital/" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
